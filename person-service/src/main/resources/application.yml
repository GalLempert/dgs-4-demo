spring:
  application:
    name: person-service

  # In-memory H2 - in-process like SQLite, but with an official Hibernate 5 dialect.
  # See README.md for how to switch to a real SQLite file database.
  datasource:
    url: jdbc:h2:mem:persondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.example: INFO

# DGS serves GraphQL at /graphql and GraphiQL at /graphiql by default
