spring:
  application:
    name: company-service

  # In-memory H2, own database - each service owns its data exclusively
  datasource:
    url: jdbc:h2:mem:companydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

# Own port so both demo services can run side by side on one machine
server:
  port: 8081

# Hard cap for non-paginated queries: filtered/list queries first COUNT the rows
# they would match and are rejected with RESULT_SET_TOO_LARGE when over this limit.
graphql:
  query:
    max-results: 100
  response:
    omit-null-fields: false

logging:
  level:
    com.example: DEBUG
